# ====================================================================
# 配置名称：clash_sub_test2.yaml      版本：v0.2.6.1.Test
# 更新日期：2026-08-30      内核要求：Mihomo (Meta) Kernel 专属
#
# 结构说明（34 个策略组）：
#   - 以 clash.js 原 17 组为基础：13 个业务组挂入「自动选择」与
#     8 个地区组；8 个地区组均为「select + 地区-自动(url-test)」
#     结构，默认选中低延时节点，组内按延时排序并自动切换；
#     「节点选择」仅保留全部可用节点。
#   - DNS / TUN / 订阅段 / 规则（50 条）与规则集（49 个）迁移自
#     V024-Single-Sub.yaml，规则目标组已映射到本配置策略组。
#   - 注意：节点选择 不可挂入 全局直连（其候选含 节点选择），
#     否则形成循环引用，内核报 loop is detected。
# ====================================================================

# ------------------------
# 基础端口/全局配置
# ------------------------
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895

allow-lan: true
mode: rule
log-level: info
external-controller: 0.0.0.0:9090
secret: "123456"
ipv6: true
unified-delay: true
tcp-concurrent: true

# ================================================================
#                  🌟【使用者核心配置区域】🌟
# ================================================================

# 机场订阅配置
# proxy-providers 或订阅 profile 中的节点）
proxy-providers:
  主力机场:    # 此处名称不能修改；若修改需同步修改策略组 use: 处的名称
    url: "https://your-main-sub-domain.com/link/token"   # 🌟 请将双引号中间的链接替换为您的机场订阅链接 🌟
    type: http
    interval: 86400
    exclude-filter: 流量|账号|剩余|到期|过期|测试|试用|TG|群|官网|Expire|APP|官方|异常|邮箱|防|卸载|@|距离|DIRECT|直接连接|邀请|返利|循环|客服|网站|网址|获取|订阅|下次|版本|官址|备用|已用|联系|工单|贩卖|倒卖|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic|GB
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 600
      timeout: 3000
      expected-status: 204
      lazy: true  # 按需唤醒测速，显著降低软路由 CPU 占用

# ================================================================
#                  🔒【系统核心逻辑区域】🔒
# ================================================================

# ------------------------
# DNS配置
# ------------------------
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: true # 强制 DNS 解析遵从后方分流规则
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - +.lan
    - +.local
    - localhost
    - '*.localdomain'
    - 'peer.tampermonkey.net'
    - 'workgroup'
    - geosite:cn
    - +.msftconnecttest.com
    - +.msftncsi.com
    - +.gov.cn
    - +.12306.cn
    - +.chsi.com.cn
    - +.apple.com
    - +.icloud.com
    - +.baidu.com
    - +.amap.com
    - +.alipay.com
    - +.alipayobjects.com
    - +.wechat.com
    - +.wechatpay.cn
    - +.unionpay.com
    - +.95516.com
    - +.tenpay.com
    - +.95559.com.cn
    - +.95599.cn
    - +.abchina.com
    - +.icbc.com.cn
    - +.ccb.com
    - +.boc.cn
    - +.cmbchina.com

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  nameserver-policy:
    "geosite:cn,private":
      - 223.5.5.5
      - 119.29.29.29
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "geosite:geolocation-!cn":
      - https://dns.google/dns-query
      - https://1.1.1.1/dns-query

  nameserver:
    - 223.5.5.5
    - 119.29.29.29

# ------------------------
# TUN模块
# ------------------------
tun:
  enable: true
  stack: mixed
  device: utun
  auto-route: true
  auto-detect-interface: true
  auto-redirect: true
  strict-route: true

# ------------------------
# 节点状态保存
# ------------------------
profile:
  store-selected: true
  store-fake-ip: true

