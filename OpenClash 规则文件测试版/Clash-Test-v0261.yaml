    url: "https://www.google.com/generate_204"
    interval: 300
    timeout: 3000
    tolerance: 30
    lazy: true
    max-failed-times: 3
    hidden: false
    include-all: true
    filter: "英国|英|伦敦|UK|United Kingdom|🇬🇧|London"

  # 其他地区（反向排除已识别地区）
  - name: 其他地区
    type: select
    interval: 300
    timeout: 3000
    url: "https://www.google.com/generate_204"
    lazy: true
    max-failed-times: 3
    hidden: false
    proxies:
      - 其他地区-自动
    include-all: true
    filter: "^((?!(直连|拒绝|广港|香港|HK|Hong Kong|🇭🇰|HongKong|广台|台湾|台灣|TW|Tai Wan|🇹🇼|🇨🇳|TaiWan|Taiwan|广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan|广新|新加坡|SG|坡|狮城|🇸🇬|Singapore|广韩|韩国|韓國|KR|首尔|春川|🇰🇷|Korea|广美|US|美国|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States|英国|UK|United Kingdom|伦敦|英|London|🇬🇧)).)*$"

  - name: 其他地区-自动
    type: url-test
    url: "https://www.google.com/generate_204"
    interval: 300
    timeout: 3000
    tolerance: 30
    lazy: true
    max-failed-times: 3
    hidden: false
    include-all: true
    filter: "^((?!(直连|拒绝|广港|香港|HK|Hong Kong|🇭🇰|HongKong|广台|台湾|台灣|TW|Tai Wan|🇹🇼|🇨🇳|TaiWan|Taiwan|广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan|广新|新加坡|SG|坡|狮城|🇸🇬|Singapore|广韩|韩国|韓國|KR|首尔|春川|🇰🇷|Korea|广美|US|美国|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States|英国|UK|United Kingdom|伦敦|英|London|🇬🇧)).)*$"

  # ===== 全局自动组：自动测速并切换到最低延时节点 =====
  - name: 自动选择
    type: url-test
    url: "https://www.google.com/generate_204"
    interval: 300
    timeout: 3000
    tolerance: 30
    lazy: true
    max-failed-times: 3
    hidden: false
    include-all: true
    filter: "^(?!.*(官网|套餐|流量|异常|剩余)).*$"

