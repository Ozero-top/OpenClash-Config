# ====================================================================
# 配置名称：OpenClash 多WiFi海外电商版
# 内核要求：Mihomo (Meta) Kernel 专属
# 架构方案：机场中转 + 独享住宅IP落地 + 多WiFi/网段精准分流 + DNS/WebRTC全局防泄漏
#
# 1. 链式代理与多网段精准分流
#   * 链式加速：采用 dialer-proxy 机制，将机场节点作为“前置中转”，独享住宅 IP 作为“落地出口”。在提升跨境访问速度与稳定性的同时，隐藏中转节点，对外展示原生住宅 IP。
#   * 物理级 WiFi/VLAN 隔离：在 rules 顶部利用 SRC-IP-CIDR 绑定特定内网网段（如 192.168.11.0/24 - 192.168.32.0/24），实现多台设备/无线 SSID 各走独立的住宅 IP 落地通道，互不干扰，避免账号关联。
#
# 2. 路由默认网段（如192.168.10.0/24）全功能路由闭环
#   * 多层级自动分流：主网段（如 192.168.10.0/24）流量跳过顶部的特规出口后自动向下流转，命中规则集（GEO 规则及 .mrs 规则集），实现国内外流量无感自动分流。
#   * 自动防泄漏机制：主网段设备默认全局 WebRTC 协议封锁（STUN/UDP 端口 3478 拦截）与 Fake-IP 双轨 DNS 解析保护，彻底规避真实 IP 暴露与 DNS 污染问题。
#   * 金融与合规直连：内置国内银行、支付平台（微信/支付宝）、政务系统的域名直连规则，保障资金与敏感业务安全。
#
# 3. 安全防护与 DNS 防泄漏体系
#   * DNS 优化：启用 Fake-IP 模式与 nameserver-policy 双轨解析，国内与海外域名分别走对应的高速 DNS，防止 DNS 污染与解析泄漏。
#   * WebRTC 物理拦截：在规则链首部针对性封锁 STUN/UDP 端口（如 3478）及相关域名，彻底杜绝浏览器通过 WebRTC 暴露路由及设备的真实物理 IP。
# ====================================================================

# ------------------------
# 基础端口/全局配置
# ------------------------
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895

allow-lan: true
mode: rule
log-level: info
external-controller: 0.0.0.0:9090
secret: "123456"
ipv6: true
unified-delay: true
tcp-concurrent: true

# ================================================================
#                   🌟【使用者核心配置区域】🌟
# ================================================================

# 1. 机场订阅配置 (作为前置中转节点池)
proxy-providers:
  主力机场:    
    url: "https://your-sub-domain.com/link/token" # 👈 请替换为实际机场订阅地址
    type: http
    interval: 86400
    exclude-filter: 流量|账号|剩余|到期|过期|测试|试用|TG|群|官网|Expire|APP|官方|异常|邮箱|防|卸载|@|距离     
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 600
      timeout: 3000
      expected-status: 204
      lazy: true  

# 2. 静态基础节点 & 落地住宅 IP 节点配置 (链式代理核心)
proxies:
  - {name: 直连, type: direct}
  - {name: 拒绝, type: reject}

  # -------------------------------------------------------------
  # 落地示例 1：利用机场【手动选择节点】做中转 (Socks5 协议示例)
  # -------------------------------------------------------------
  - name: "住宅IP-Socks5-美国-WiFi001"
    type: socks5
    server: 192.0.2.1               # 填写住宅 IP 的服务器地址 (或域名，如 us-res.proxy.com)
    port: 10800                     # 填写 Socks5 代理端口
    username: "your_username"       # 填写服务商提供的 Socks5 账号 (若无需认证可删掉此行)
    password: "your_password"       # 填写服务商提供的 Socks5 密码 (若无需认证可删掉此行)
    udp: true                       # 是否开启 UDP 转发
    dialer-proxy: "所有-手动"        # 核心：由 OpenClash 面板中手动选定的机场节点作为前置中转

  - name: "住宅IP-Socks5-美国-WiFi002"
    type: socks5
    server: 192.0.2.1               
    port: 10800                     
    username: "your_username"       
    password: "your_password"       
    udp: true                       
    dialer-proxy: "所有-手动"        

  # -------------------------------------------------------------
  # 落地示例 2：利用机场【手动选择节点】做中转 (VLESS 协议示例)
  # -------------------------------------------------------------
  - name: "住宅IP-VLESS-美国-WiFi003"
    type: vless
    server: 192.0.2.2                               # 填写 VLESS 落地节点服务器 IP 或域名
    port: 443                                       # 填写 VLESS 服务端口
    uuid: "a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d"    # 填写节点的 UUID 用户标识
    udp: true                                       # 开启 UDP 支持
    tls: true                                       # 是否开启 TLS 加密
    servername: gateway.yourdomain.com              # 填写 SNI (伪装域名)
    # client-fingerprint: chrome                    # 可选：客户端指纹识别
    
    # ---------------------------------------------------------
    # 情况 A：如果节点使用的是 VLESS + REALITY 协议，请取消下方的注释：
    # ---------------------------------------------------------
    # reality-opts:
    #   public-key: "YourPublicKeyHereStringLength43Chars" # 填写 REALITY 公钥 (PublicKey)
    #   short-id: "1a2b3c4d"                               # 填写简短 ID (ShortId)

    dialer-proxy: "所有-手动"        # 核心：由 OpenClash 面板中手动选定的机场节点作为前置中转

  - name: "住宅IP-VLESS-美国-WiFi004"
    type: vless
    server: 192.0.2.2                               
    port: 443                                       
    uuid: "a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d"    
    udp: true                                       
    tls: true                                       
    servername: gateway.yourdomain.com              
    # client-fingerprint: chrome                    # 可选：客户端指纹识别

    # ---------------------------------------------------------
    # 情况 B：如果节点使用的是 VLESS + WebSocket 协议，请取消下方的注释：
    # ---------------------------------------------------------
    # network: ws
    # ws-opts:
    #   path: "/your-ws-path"                              # 填写 WebSocket 路径
    #   headers:
    #     Host: "gateway.yourdomain.com"                  # 填写 WS 对应的 Host 域名

    dialer-proxy: "所有-手动"        # 核心：由 OpenClash 面板中手动选定的机场节点作为前置中转

# ================================================================
#                   🔒【系统核心逻辑区域】🔒
# ================================================================

# ------------------------
# DNS配置
# ------------------------
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: true 
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - +.lan
    - +.local
    - localhost
    - '*.localdomain'
    - 'peer.tampermonkey.net'
    - 'workgroup'
    - geosite:cn
    - +.msftconnecttest.com
    - +.msftncsi.com
    - +.gov.cn
    - +.12306.cn
    - +.chsi.com.cn
    - +.apple.com
    - +.icloud.com
    - +.baidu.com
    - +.amap.com
    - +.alipay.com
    - +.alipayobjects.com
    - +.wechat.com
    - +.wechatpay.cn
    - +.unionpay.com
    - +.95516.com
    - +.tenpay.com
    - +.95559.com.cn
    - +.95599.cn
    - +.abchina.com
    - +.icbc.com.cn
    - +.ccb.com
    - +.boc.cn
    - +.cmbchina.com

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    
  nameserver-policy:
    "geosite:cn,private":
      - 223.5.5.5
      - 119.29.29.29
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "geosite:geolocation-!cn":
      - https://dns.google/dns-query
      - https://1.1.1.1/dns-query

  nameserver:
    - 223.5.5.5
    - 119.29.29.29

# ------------------------
# TUN模块
# ------------------------
tun:
  enable: true
  stack: mixed
  device: utun
  auto-route: true
  auto-detect-interface: true
  auto-redirect: true
  strict-route: true

# ------------------------
# 节点状态保存
# ------------------------
profile:
  store-selected: true
  store-fake-ip: true

# ------------------------
# 策略组锚点
# ------------------------
default: &default
  type: select
  proxies:
    - 纯静态住宅-落地组     
    - 所有-自动          
    - 所有-手动
    - 香港-故转
    - 台湾-故转
    - 日本-故转
    - 新加坡-故转
    - 韩国-故转
    - 美国-故转
    - 英国-故转
    - 其他-故转
    - 直连
    - 拒绝

# ------------------------
# 核心策略组逻辑
# ------------------------
