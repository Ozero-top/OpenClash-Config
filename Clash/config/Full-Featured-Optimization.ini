[custom]
; 默认节点名称与订阅基础配置
default_url=

; -------------------- DNS 配置 --------------------
dns_enable=true
dns_listen=0.0.0.0:1053
dns_ipv6=false
dns_prefer_h3=false
dns_respect_rules=true
dns_use_system_hosts=false
dns_cache_algorithm=arc
dns_enhanced_mode=fake-ip
dns_fake_ip_range=198.18.0.1/16

; Fake-IP 过滤名单
dns_fake_ip_filter=+.lan,+.local,+.msftconnecttest.com,+.msftncsi.com,localhost.ptlogin2.qq.com,localhost.sec.qq.com,+.in-addr.arpa,+.ip6.arpa,time.*.com,time.*.gov,pool.ntp.org,localhost.work.weixin.qq.com

; DNS 服务器配置
dns_nameserver=https://208.67.222.222/dns-query,https://77.88.8.8/dns-query,https://1.1.1.1/dns-query,https://8.8.4.4/dns-query
dns_fallback=
dns_proxy_server_nameserver=https://223.5.5.5/dns-query,https://doh.pub/dns-query

