# ====================================================================
# 配置名称：OpenClash 区域全自动流控与延迟优化 (终极完美版)
# 版本号：V0.2.4 (2026.08.09 生产环境推荐版)
# 内核要求：Mihomo (Meta) Kernel 专属
# 优化要点：
#   1. [DNS严格分流] 开启 respect-rules 与精准 fake-ip-filter，杜绝 DNS 污染与回环
#   2. [解锁感知测速] 为 OpenAI、Netflix、Disney+ 策略组配置专属解锁检测 URL
#   3. [架构无缝降级] 修正 fallback 与 select 嵌套逻辑，保障节点秒级无感故障转移
#   4. [多镜像镜像源] 为远程规则配置 CDN/Ghproxy 备用链路，防止单点镜像失效
# ====================================================================

# ------------------------
# 基础端口/全局配置
# ------------------------
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895

allow-lan: true
mode: rule
log-level: info
external-controller: 0.0.0.0:9090
secret: "123456"
ipv6: true
unified-delay: true
tcp-concurrent: true

# ================================================================
#                  🌟【使用者核心配置区域】🌟
# ================================================================

# 1. 机场订阅配置
proxy-providers:
  主力机场:    # 此处名称不能修改；若修改需同步修改策略组 use: 处的名称
    url: "此处填写机场订阅地址"
    type: http
    interval: 86400
    exclude-filter: 流量|账号|剩余|到期|过期|测试|试用|TG|群|官网|Expire|APP|官方|异常|邮箱|防|卸载|@|距离     
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 600
      timeout: 3000
      expected-status: 204
      lazy: true  # 按需唤醒测速，显著降低软路由 CPU 占用        
      
# 2. 静态基础节点
proxies:
  - {name: 直连, type: direct}
  - {name: 拒绝, type: reject}

# ================================================================
#                  🔒【系统核心逻辑区域】🔒
# ================================================================

# ------------------------
# DNS配置
# ------------------------
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: true # 强制 DNS 解析遵从后方分流规则
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - +.lan
    - +.local
    - localhost
    - '*.localdomain'
    - 'peer.tampermonkey.net'
    - 'workgroup'
    - geosite:cn
    - +.msftconnecttest.com
    - +.msftncsi.com
    - +.gov.cn
    - +.12306.cn
    - +.chsi.com.cn
    - +.apple.com
    - +.icloud.com
    - +.baidu.com
    - +.amap.com
    - +.alipay.com
    - +.alipayobjects.com
    - +.wechat.com
    - +.wechatpay.cn
    - +.unionpay.com
    - +.95516.com
    - +.tenpay.com
    - +.95559.com.cn
    - +.95599.cn
    - +.abchina.com
    - +.icbc.com.cn
    - +.ccb.com
    - +.boc.cn
    - +.cmbchina.com

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    
  nameserver-policy:
    "geosite:cn,private":
      - 223.5.5.5
      - 119.29.29.29
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "geosite:geolocation-!cn":
      - https://dns.google/dns-query
      - https://1.1.1.1/dns-query

  nameserver:
    - 223.5.5.5
    - 119.29.29.29

# ------------------------
# TUN模块
# ------------------------
tun:
  enable: true
  stack: mixed
  device: utun
  auto-route: true
  auto-detect-interface: true
  auto-redirect: true
  strict-route: true

# ------------------------
# 节点状态保存
# ------------------------
profile:
  store-selected: true
  store-fake-ip: true

# ------------------------
# 策略组锚点
# ------------------------
default: &default
  type: select
  proxies:
    - 直连
    - 所有-自动          
    - 所有-手动
    - 香港-故转
    - 台湾-故转
    - 日本-故转
    - 新加坡-故转
    - 韩国-故转
    - 美国-故转
    - 英国-故转
    - 其他-故转
    - 拒绝

# ------------------------
# 核心策略组逻辑
# ------------------------
proxy-groups:
  # 1. 业务分流组
  - {name: ChatGPT, <<: *default}
  - {name: Gemini, <<: *default}
  - {name: Copilot, <<: *default}
  - {name: Perplexity, <<: *default}
  - {name: Claude, <<: *default}
  - {name: Meta AI, <<: *default}
  - {name: Grok, <<: *default}
  - {name: Groq, <<: *default}
  - {name: GitHub, <<: *default}
  - {name: Reddit, <<: *default}
  - {name: Telegram, <<: *default}
  - {name: WhatsApp, <<: *default}
  - {name: Facebook, <<: *default}
  - {name: BiliBili, <<: *default}
  - {name: YouTube, <<: *default}
  - {name: TikTok, <<: *default}
  - {name: Netflix, <<: *default}
  - {name: HBO, <<: *default}
  - {name: Disney, <<: *default}
  - {name: Amazon, <<: *default}
  - {name: Crunchyroll, <<: *default}
  - {name: Popcorn, <<: *default}
  - {name: Spotify, <<: *default}
  - {name: Nvidia, <<: *default}
  - {name: Steam, <<: *default}
  - {name: Games, <<: *default}
  - {name: Crypto, <<: *default}
  - {name: Apple, <<: *default}
  - {name: Google, <<: *default}
  - {name: Microsoft, <<: *default}
  - {name: Test, <<: *default}
  - {name: Block, <<: *default}
  - {name: 国外, <<: *default}
  - {name: 国内, <<: *default}
  - {name: 其他, <<: *default}
  
  # 2. 全局节点组
  - name: 所有-手动
    type: select
    use:
      - 主力机场
    exclude-filter: "直连|拒绝"

  - name: 所有-自动
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    timeout: 3000          
    use:
      - 主力机场
    tolerance: 30
    lazy: true
    exclude-filter: "直连|拒绝" 
    use-provider-health: true
    
  # 香港组
  - name: 香港-故转
    type: fallback
    url: https://www.gstatic.com/generate_204
    interval: 300
    timeout: 3000          
    proxies:
      - 香港-自动          
      - 香港-手动
  - name: 香港-手动
    type: select
    use:
      - 主力机场
    filter: "广港|香港|HK|Hong Kong|🇭🇰|HongKong"
