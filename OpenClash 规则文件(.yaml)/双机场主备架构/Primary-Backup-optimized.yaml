    type: select
    use: [下载机场]
    filter: *fsg
  - name: 新加坡-下载自动
    <<: *ut
    use: [下载机场]
    filter: *fsg

  # 韩国
  - name: 韩国-下载故转
    <<: *fb
    proxies: [韩国-下载自动, 韩国-下载手动]
  - name: 韩国-下载手动
    type: select
    use: [下载机场]
