    filter: *fkr

  # 美国
  - name: 美国-下载故转
    <<: *fb
    proxies: [美国-下载自动, 美国-下载手动]
  - name: 美国-下载手动
    type: select
    use: [下载机场]
    filter: *fus
  - name: 美国-下载自动
    <<: *ut
