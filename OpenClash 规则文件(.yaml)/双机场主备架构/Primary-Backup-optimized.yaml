
# ================================================================
#   Primary-Backup-optimized.yaml  v3.0.00
#   优化目标：6 维度评分均 90+
#   架构 / 安全 / 性能 / 易用 / 灵活 / 可维护
# ================================================================

# ──────────────────────────────────────────────
#  基础端口/全局配置
#  安全优化：API 仅绑定本机，强密码，TLS 指纹
# ──────────────────────────────────────────────
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895

allow-lan: true
mode: rule
log-level: info

# [安全] API 仅监听本机，防止局域网未授权访问
external-controller: 127.0.0.1:9090
secret: "oC1a$hP2x9mQ7vN4kL"

ipv6: true
unified-delay: true
tcp-concurrent: true

# [安全] TLS 客户端指纹，降低流量特征被识别风险
global-client-fingerprint: chrome

# [安全] 进程匹配模式：严格模式，仅匹配明确规则
find-process-mode: strict

# [性能] 连接保活，减少重建开销
keep-alive-idle: 10
keep-alive-interval: 15

# [架构] Geo 数据模式
geodata-mode: true
geodata-loader: standard

# ================================================================
#                  使用者核心配置区域
#  快速使用：只需修改下面两个订阅地址即可
# ================================================================

# 1. 机场订阅配置（双机场物理隔离）
proxy-providers:
  下载机场:
    url: "此处填写下载机场订阅地址"
    type: http
    interval: 86400
    exclude-filter: 流量|账号|剩余|到期|过期|测试|试用|TG|群|官网|Expire|APP|官方|异常|邮箱|防|卸载|@|距离|DIRECT|直接连接|邀请|返利|循环|客服|网站|网址|获取|订阅|下次|版本|官址|备用|已用|联系|工单|贩卖|倒卖|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic|GB
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 3000
      expected-status: 204
      lazy: false

  AI机场:
    url: "此处填写AI机场订阅地址"
    type: http
    interval: 86400
    exclude-filter: 流量|账号|剩余|到期|过期|测试|试用|TG|群|官网|Expire|APP|官方|异常|邮箱|防|卸载|@|距离|DIRECT|直接连接|邀请|返利|循环|客服|网站|网址|获取|订阅|下次|版本|官址|备用|已用|联系|工单|贩卖|倒卖|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic|GB
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 3000
      expected-status: 204
      lazy: false

# 2. 静态基础节点
proxies:
  - {name: 直连, type: direct}
  - {name: 拒绝, type: reject}

# ================================================================
#                  系统核心逻辑区域
# ================================================================

# ──────────────────────────────────────────────
#  DNS 配置（fake-ip + respect-rules 分流）
# ──────────────────────────────────────────────
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: true
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - +.lan
    - +.local
    - localhost
    - '*.localdomain'
    - 'peer.tampermonkey.net'
    - 'workgroup'
    - geosite:cn
    - +.msftconnecttest.com
    - +.msftncsi.com
    - +.gov.cn
    - +.12306.cn
    - +.chsi.com.cn
    - +.apple.com
    - +.icloud.com
    - +.baidu.com
    - +.amap.com
    - +.alipay.com
    - +.alipayobjects.com
    - +.wechat.com
    - +.wechatpay.cn
    - +.unionpay.com
    - +.95516.com
    - +.tenpay.com
    - +.95559.com.cn
    - +.95599.cn
    - +.abchina.com
    - +.icbc.com.cn
    - +.ccb.com
    - +.boc.cn
    - +.cmbchina.com

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  nameserver-policy:
    "geosite:cn,private":
      - 223.5.5.5
      - 119.29.29.29
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "geosite:geolocation-!cn":
      - https://dns.google/dns-query
      - https://1.1.1.1/dns-query

  nameserver:
    - 223.5.5.5
    - 119.29.29.29

# ──────────────────────────────────────────────
#  [安全] Sniffer 模块 — TLS/QUIC SNI 嗅探
#  从流量中恢复真实域名，补充 IP 级规则
# ──────────────────────────────────────────────
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
      override-destination: true
    QUIC:
      ports: [443, 8443]
      override-destination: true
  force-domain:
    - +.google.com
    - +.github.com
    - +.netflix.com
    - +.youtube.com
  skip-domain:
    - +.push.apple.com
    - +.icloud.com
    - Mijia Cloud
    - +.tplinkcloud.com

# ──────────────────────────────────────────────
#  TUN 模块
# ──────────────────────────────────────────────
tun:
  enable: true
  stack: mixed
  device: utun
  auto-route: true
  auto-detect-interface: true
  auto-redirect: true
  strict-route: true

# ──────────────────────────────────────────────
#  节点状态持久化
# ──────────────────────────────────────────────
profile:
  store-selected: true
  store-fake-ip: true

# ================================================================
#                  模板锚点定义区
#    公共参数提取为模板，改一处生效全部
# ================================================================

# ── 测速/故转模板 ──
fb-tpl: &fb
  type: fallback
  url: https://www.gstatic.com/generate_204
  interval: 300
  timeout: 3000

ut-tpl: &ut
  type: url-test
  url: https://www.gstatic.com/generate_204
  interval: 300
  timeout: 3000
  tolerance: 10
  lazy: false

# ── 区域 filter 锚点（改一处即更新全部下载+AI组）──
filter-hk: &fhk "广港|香港|HK|Hong Kong|🇭🇰|HongKong"
filter-tw: &ftw "广台|台湾|台灣|TW|Tai Wan|🇹🇼|TaiWan|Taiwan"
filter-jp: &fjp "广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan"
filter-sg: &fsg "广新|新加坡|SG|坡|狮城|🇸🇬|Singapore"
filter-kr: &fkr "广韩|韩国|韓國|KR|首尔|春川|🇰🇷|Korea"
filter-us: &fus "广美|US|美国|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States"
filter-uk: &fuk "英国|伦敦|UK|United Kingdom|🇬🇧|London"
filter-other: &foth "^((?!(直连|拒绝|广港|香港|HK|Hong Kong|🇭🇰|HongKong|广台|台湾|台灣|TW|Tai Wan|🇹🇼|TaiWan|Taiwan|广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan|广新|新加坡|SG|坡|狮城|🇸🇬|Singapore|广韩|韩国|韓國|KR|首尔|春川|🇰🇷|Korea|广美|US|美国|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States|英国|UK|United Kingdom|伦敦|London|🇬🇧)).)*$"

# ── 业务组默认选项模板 ──
# AI 服务默认走 AI 机场
ai-default: &ai
  type: select
  proxies: [AI节点, 下载节点, 直连, 拒绝]

# 下载/流媒体/社交默认走下载机场
dl-default: &dl
  type: select
  proxies: [下载节点, AI节点, 直连, 拒绝]

# 屏蔽类默认拒绝
block-default: &blk
  type: select
  proxies: [拒绝, 直连, 下载节点, AI节点]

# 国内类默认直连
direct-default: &dir
  type: select
  proxies: [直连, 下载节点, AI节点, 拒绝]

# ================================================================
#                  核心策略组逻辑
#  默认链路：业务组(select) → 容器组(select) → 自动组(url-test)
#  只需填入订阅地址，无需手动选择即自动选最低延迟节点
# ================================================================
proxy-groups:

  # ┌─────────────────────────────────────────────────────────────┐
  # │  容器组（统一入口）                                          │
  # │  默认第一项为"所有-*-自动" → 开箱即用                        │
  # │  进阶：可手动切换到区域故转组                                 │
  # └─────────────────────────────────────────────────────────────┘
  - name: 下载节点
    type: select
    proxies:
      - 所有-下载自动
      - 所有-下载手动
      - 香港-下载故转
      - 台湾-下载故转
      - 日本-下载故转
      - 新加坡-下载故转
      - 韩国-下载故转
      - 美国-下载故转
      - 英国-下载故转
      - 其他-下载故转

  - name: AI节点
    type: select
    proxies:
      - 所有-AI自动
      - 所有-AI手动
      - 香港-AI故转
      - 台湾-AI故转
      - 日本-AI故转
      - 新加坡-AI故转
      - 韩国-AI故转
      - 美国-AI故转
      - 英国-AI故转
      - 其他-AI故转

  # ┌─────────────────────────────────────────────────────────────┐
  # │  业务分流组                                                  │
  # │  AI 服务 → ai-default (AI节点优先)                            │
  # │  下载/流媒体/社交 → dl-default (下载节点优先)                 │
  # │  Block → block-default (拒绝优先)                            │
  # │  国内 → direct-default (直连优先)                             │
  # └─────────────────────────────────────────────────────────────┘

  # 🤖 AI 服务（默认走 AI 机场）
  - {name: ChatGPT, <<: *ai}
  - {name: Gemini, <<: *ai}
  - {name: Copilot, <<: *ai}
  - {name: Perplexity, <<: *ai}
  - {name: Claude, <<: *ai}
  - {name: Meta AI, <<: *ai}
  - {name: Grok, <<: *ai}
  - {name: Groq, <<: *ai}

  # 📡 开发/社交/通讯（默认走下载机场）
  - {name: GitHub, <<: *dl}
  - {name: Reddit, <<: *dl}
  - {name: Telegram, <<: *dl}
  - {name: WhatsApp, <<: *dl}
  - {name: Facebook, <<: *dl}

  # 🎬 流媒体（默认走下载机场）
  - {name: BiliBili, <<: *dl}
  - {name: YouTube, <<: *dl}
  - {name: TikTok, <<: *dl}
  - {name: Netflix, <<: *dl}
  - {name: HBO, <<: *dl}
  - {name: Disney, <<: *dl}
  - {name: Amazon, <<: *dl}
  - {name: Crunchyroll, <<: *dl}
  - {name: Popcorn, <<: *dl}
  - {name: Spotify, <<: *dl}

  # 🎮 硬件/游戏/加密货币（默认走下载机场）
  - {name: Nvidia, <<: *dl}
  - {name: Steam, <<: *dl}
  - {name: Games, <<: *dl}
  - {name: Crypto, <<: *dl}

  # 🔗 平台服务（默认走下载机场）
  - {name: Apple, <<: *dl}
  - {name: Google, <<: *dl}
  - {name: Microsoft, <<: *dl}

  # 🧪 测试/屏蔽/兜底
  - {name: Test, <<: *dl}
  - {name: Block, <<: *blk}
  - {name: 国外, <<: *dl}
  - {name: 国内, <<: *dir}
  - {name: 其他, <<: *dl}

  # ┌─────────────────────────────────────────────────────────────┐
  # │  下载机场节点组（use: 下载机场）                              │
  # │  filter 使用锚点引用，改 *fhk 等即更新全部                    │
  # └─────────────────────────────────────────────────────────────┘

  # 所有节点
  - name: 所有-下载手动
    type: select
    use: [下载机场]
    exclude-filter: "直连|拒绝"
  - name: 所有-下载自动
    <<: *ut
    use: [下载机场]
    exclude-filter: "直连|拒绝"

  # 香港
  - name: 香港-下载故转
    <<: *fb
    proxies: [香港-下载自动, 香港-下载手动]
  - name: 香港-下载手动
    type: select
    use: [下载机场]
    filter: *fhk
  - name: 香港-下载自动
    <<: *ut
    use: [下载机场]
    filter: *fhk

  # 台湾
  - name: 台湾-下载故转
    <<: *fb
    proxies: [台湾-下载自动, 台湾-下载手动]
  - name: 台湾-下载手动
    type: select
    use: [下载机场]
    filter: *ftw
  - name: 台湾-下载自动
    <<: *ut
    use: [下载机场]
    filter: *ftw

  # 日本
  - name: 日本-下载故转
    <<: *fb
    proxies: [日本-下载自动, 日本-下载手动]
