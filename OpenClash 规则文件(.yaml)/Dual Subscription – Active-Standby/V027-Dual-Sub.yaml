# ====================================================================
# 配置名称：OpenClash V027 双订阅主力优先稳定版
# 原始配置：双订阅（主力机场+备用机场）
# # 配置名称：OpenClash 区域全自动流控与延迟优化 (双机场融合终极优化版)
# 适配内核：Mihomo (Clash Meta) Kernel 专属
# 优化重点：双机场负载聚合、Fake-IP 精准过滤、规则链路降耗
# ====================================================================

# ------------------------
# 基础端口/全局配置
# ------------------------
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895

allow-lan: true
mode: rule
log-level: info
external-controller: 0.0.0.0:9090
secret: "V026-Dual-OC-7fK3m9Q2xL8pR4sN6wT1"
ipv6: true
unified-delay: true
tcp-concurrent: true

# ================================================================
#                  🌟【使用者核心配置区域】🌟
# ================================================================

# 1. 机场订阅配置（双机场聚合）
proxy-providers:
  主力机场:    # 此处名称不能修改；若修改需同步修改策略组 use: 处的名称
    url: "此处填写主力机场订阅地址"
    type: http
    interval: 86400
    exclude-filter: 流量|账号|剩余|到期|过期|测试|试用|TG|群|官网|Expire|APP|官方|异常|邮箱|防|卸载|@|距离|DIRECT|直接连接|邀请|返利|循环|客服|网站|网址|获取|订阅|下次|版本|官址|备用|已用|联系|工单|贩卖|倒卖|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic|GB     
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 600
      timeout: 3000
      expected-status: 204
      lazy: true  # 按需唤醒测速，显著降低软路由 CPU 占用        

  备用机场:    # 第二个机场配置
    url: "此处填写备用机场订阅地址"
    type: http
    interval: 86400
    exclude-filter: 流量|账号|剩余|到期|过期|测试|试用|TG|群|官网|Expire|APP|官方|异常|邮箱|防|卸载|@|距离|DIRECT|直接连接|邀请|返利|循环|客服|网站|网址|获取|订阅|下次|版本|官址|备用|已用|联系|工单|贩卖|倒卖|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic|GB     
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 600
      timeout: 3000
      expected-status: 204
      lazy: true
      
# 2. 静态基础节点
proxies:
  - {name: 直连, type: direct}
  - {name: 拒绝, type: reject}

# ================================================================
#                  🔒【系统核心逻辑区域】🔒
# ================================================================

# ------------------------
# DNS配置
# ------------------------
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: true # 强制 DNS 解析遵从后方分流规则
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - +.lan
    - +.local
    - localhost
    - '*.localdomain'
    - 'peer.tampermonkey.net'
    - 'workgroup'
    - geosite:cn
    - +.msftconnecttest.com
    - +.msftncsi.com
    - +.gov.cn
    - +.12306.cn
    - +.chsi.com.cn
    - +.apple.com
    - +.icloud.com
    - +.baidu.com
    - +.amap.com
    - +.alipay.com
    - +.alipayobjects.com
    - +.wechat.com
    - +.wechatpay.cn
    - +.unionpay.com
    - +.95516.com
    - +.tenpay.com
    - +.95559.com.cn
    - +.95599.cn
    - +.abchina.com
    - +.icbc.com.cn
    - +.ccb.com
    - +.boc.cn
    - +.cmbchina.com
    - +.bilibili.com
    - +.hdslb.com
    - +.qq.com
    - +.taobao.com
    - +.jd.com

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    
  nameserver-policy:
    "geosite:cn,private":
      - 223.5.5.5
      - 119.29.29.29
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "geosite:geolocation-!cn":
      - https://dns.google/dns-query
      - https://1.1.1.1/dns-query

  nameserver:
    - 223.5.5.5
    - 119.29.29.29

# ------------------------
# TUN模块
# ------------------------
tun:
  enable: true
  stack: mixed
  device: utun
  auto-route: true
  auto-detect-interface: true
  strict-route: true

# ------------------------
# 节点状态保存
# ------------------------
profile:
  store-selected: true
  store-fake-ip: true

# ------------------------
# 策略组锚点
# ------------------------
default: &default
  type: select
  proxies:
    - 主力优先
    - 主力-自动
    - 备用-自动
    - 所有-手动
    - 香港-故转
    - 台湾-故转
    - 日本-故转
    - 新加坡-故转
    - 韩国-故转
    - 美国-故转
    - 英国-故转
    - 其他-故转
