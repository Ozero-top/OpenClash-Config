# OpenClash_Rules:Clash_Sub.yaml
# 配置名称：OpenClash 标准故障转移分流配置
# 版本号：V0.2.5 (2026.08.28)
# 内核要求：Mihomo (Meta) Kernel
# 文件范围：仅定义 proxy-providers、proxy-groups、rule-providers、rules 四段；
#   端口、运行模式、DNS、IPv6、TUN、嗅探、GeoData、日志及控制器等参数全部由 OpenClash LuCI 管理。
# 规则特性：
#   1) WebRTC 物理防泄漏（UDP 3478 / stun / webrtc 拒绝）
#   2) 银行/支付/政务/风控 + 国内核心服务强制直连
#   3) 远程规则集（blackmatrix7 / meta-rules-dat / liandu2024）与本地 GEOSITE 服务规则互补
#   4) CN 域名/IP 兜底直连，漏网之鱼 fallback 兜底，非标端口分流
# 策略组分流说明：
#   🚀 故障转移    代理主入口：Custom 代理域名/IP、GFW 列表、加密货币交易所(OKX/Bybit/Binance)、通用代理域名
#   ♻️ 自动选择    全部节点按延迟自动选优，作为其他 fallback 组的兜底候选
#   💬 即时通讯    Telegram 域名/IP、WhatsApp、GEOSITE category-communication 通讯类集合
#   🌐 社交媒体    Reddit、Facebook、GEOSITE 非中文社交媒体集合、Twitter/Facebook IP 段
#   🚀 GitHub      GitHub 域名（GEOSITE github + 远程规则集）
#   🤖 ChatGPT     OpenAI/ChatGPT 域名（GEOSITE openai + 远程规则集）
#   🤖 AI服务      Claude、Meta AI、Perplexity、Copilot、Gemini、Groq、Grok + GEOSITE category-ai-!cn 集合
#   🎶 TikTok      TikTok 域名（GEOSITE tiktok + 远程规则集）
#   📹 YouTube     YouTube 域名（GEOSITE youtube + 远程规则集）
#   🎥 Netflix     Netflix 域名/IP + DOMAIN-KEYWORD netflix + GEOIP netflix
#   🎥 DisneyPlus  Disney 域名（GEOSITE disney + 远程规则集）
#   🎥 HBO         HBO 域名（GEOSITE hbo + 远程规则集）
#   🎥 PrimeVideo  Amazon Prime Video（GEOSITE primevideo + 远程规则集 Amazon）
#   🎥 AppleTV+   GEOSITE apple-tvplus
#   🎥 Emby       GEOSITE category-emby（自建/共享 Emby 媒体服务）
#   🎻 Spotify    Spotify 域名（GEOSITE spotify + 远程规则集）
#   📺 Bahamut    巴哈姆特动画疯（GEOSITE bahamut，台湾节点优先）
#   🌎 国外媒体    GEOSITE category-entertainment + Crunchyroll + Popcorn
#   🛒 国外电商    GEOSITE category-ecommerce 国外电商集合
#   📢 谷歌FCM     GEOSITE googlefcm（Firebase Cloud Messaging 推送）
#   🇬 谷歌服务    Google 域名/IP（GEOSITE google + 远程规则集 + GEOIP google）
#   🍎 苹果服务    Apple 全球 + Apple-CN 域名（GEOSITE apple + 远程规则集），默认直连可切代理
#   Ⓜ️ 微软服务    Microsoft 域名（GEOSITE microsoft + 远程规则集），默认直连可切代理
#   🎮 游戏平台    GEOSITE category-games + Epic/EA/Blizzard/UBI/PlayStation/Nintendo/Nvidia 远程规则集
#   🎮 Steam      Steam 域名 + Steam CDN 域名/IP（GEOSITE steam + 远程规则集），默认直连可切代理
#   🚀 测速工具    GEOSITE category-speedtest + Test/Domain 测速列表，默认直连可切代理
#   🐟 漏网之鱼    MATCH 兜底入口，承接所有未命中规则的流量
#   🔀 非标端口    Nonstandard_Port_Direct 规则集（非标准端口分流）
#   🎯 全球直连    DIRECT 入口：私有网络/Custom 直连域名/IP/端口/Steam CDN/Google CN/国内游戏下载/PT tracker/12306/政务/银行/支付等
#   🇭🇰🇺🇸🇯🇵🇸🇬🇼🇸🇰🇷 各区域节点 url-test 自动选优，按节点名地理标签筛选

# ==================== 代理提供者 Proxy Providers ====================
# provider1 用于加载机场订阅；多订阅用户可复制并依次命名为 provider2、provider3……
# 新增 Provider 后，还需将其加入相关策略组的 use 列表。
proxy-providers:
  provider1:
    type: http
    url: "https://your-sub-domain.com/link/token"  # 双引号中填入订阅链接
    interval: 3600  # 订阅更新间隔，单位：秒
    path: ./proxy_provider/provider1.yaml
    proxy: DIRECT  # 下载订阅时使用的策略
    # 在 Provider 层统一排除公告、流量、到期等非节点条目，避免各策略组重复配置
    filter: "^(?!.*(DIRECT|直接连接|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic|GB|Expire)).*$"
    header:  # 可选：自定义 HTTP 请求头
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 300
      timeout: 5000
      lazy: false
      expected-status: 204
    override:
      udp: true
      # 不建议默认跳过 TLS 证书校验；仅在明确需要兼容特定节点时启用
      # skip-cert-verify: true
      # additional-prefix: "[provider1]"
      # additional-suffix: "test"

# ==================== 代理策略组 Proxy Groups ====================
# 策略组候选顺序、分组类型保持一致；公共节点过滤在 provider1 层统一完成。
# fallback 组显式补齐健康检查参数，按候选顺序选择首个可用项。
